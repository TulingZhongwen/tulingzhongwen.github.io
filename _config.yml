name: "图灵中文"
description: "独立研究者 | 意识物理 | 惯性-张力理论 | PCC宇宙学模型 | 意识测量"
url: "https://tulingzhongwen.github.io"
baseurl: ""
repository: "TulingZhongwen/tulingzhongwen.github.io"

# Site Author
author:
  name: "图灵中文"
  avatar: "profile.png"   # 可选，可在根目录放头像
  bio: "独立研究者。提出惯性-张力理论(ITT)、PCC宇宙学模型、CFM意识场论。将意识从哲学推向可实验检验的物理理论。"
  location: "中国深圳"
  email: "tulingzhongwen@zohomail.com"
  uri: "https://tulingzhongwen.github.io"

# Social/Academic Links
github: "TulingZhongwen"
orcid: "0009-0004-7942-112X"
email: "tulingzhongwen@zohomail.com"

# 以下不用可留空
academia: ""
arxiv: ""
googlescholar: ""
bitbucket: ""
twitter: ""
linkedin: ""

# Footer links
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/TulingZhongwen"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0004-7942-112X"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:tulingzhongwen@zohomail.com"

# Build settings
remote_theme: academicpages/academicpages.github.io   # 关键修改：使用 remote_theme
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Markdown Processing
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
